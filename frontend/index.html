
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillAssess | Online Skill Assessment</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="#" class="brand" data-page="dashboard">
        <span class="brand-icon">S</span>
        <span>
          <strong>SkillAssess</strong>
          <small>Cloud Assessment Platform</small>
        </span>
      </a>

      <p class="nav-heading">MAIN MENU</p>

      <nav class="navigation">
        <button class="nav-item active" data-page="dashboard">
          <span>▦</span> Dashboard
        </button>
        <button class="nav-item" data-page="assessments">
          <span>▤</span> Assessments
        </button>
        <button class="nav-item" data-page="results">
          <span>▥</span> My Results
        </button>
        <button class="nav-item" data-page="profile">
          <span>◉</span> My Profile
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="cloud-icon">☁</div>
        <h3>Cloud Learning</h3>
        <p>Assess your skills anytime, anywhere.</p>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p class="eyebrow">STUDENT WORKSPACE</p>
          <h1 id="page-title">Dashboard</h1>
        </div>

        <div class="user-summary">
          <div class="avatar" id="header-avatar">S</div>
          <div>
            <strong id="header-name">Student</strong>
            <small>Student Account</small>
          </div>
        </div>
      </header>

      <section id="content" class="page-content"></section>

      <footer class="footer">
        © 2026 SkillAssess · Online Skill Assessment Platform Using Cloud
      </footer>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
